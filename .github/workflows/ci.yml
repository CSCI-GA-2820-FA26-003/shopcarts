name: CI Build

"on":
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  checks:
    name: Tests and quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
      FLASK_APP: wsgi:app
      SECRET_KEY: ci-only-test-secret
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_DONT_LOAD_ENV: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v7
        with: 
          python-version: "3.12"

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install pipenv
          pipenv verify
          pipenv sync --dev
          pipenv run python -m pip check

      - name: Run flake8
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          pipenv run flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          pipenv run flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pylint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pipenv run pylint service tests --max-line-length=127

      - name: Run existing test target
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          PYTEST_ADDOPTS: >-
            --cov=service
            --cov-report=term-missing
            --cov-report=xml:coverage.xml
        run: |
          rm -f coverage.xml .coverage
          pipenv run make test

      - name: Verify report and require 95 percent coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          test -s coverage.xml
          pipenv run coverage report --fail-under=95

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

     
      

