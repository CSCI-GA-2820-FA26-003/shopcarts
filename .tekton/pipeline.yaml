apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: shopcarts
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/CSCI-GA-2820-FA26-003/shopcarts.git
    - name: revision
      type: string
      default: master
  workspaces:
    - name: source
      description: Shared checkout for the repository and downstream tasks.
  tasks:
    - name: check-workspace
      taskRef:
        name: shopcarts-check-workspace
      workspaces:
        - name: source
          workspace: source
    - name: clone
      runAfter:
        - check-workspace
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
